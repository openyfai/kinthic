version: '3.8'

services:
  aria-graph:
    profiles:
      - web
    build: .
    container_name: aria-graph
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
      - ./skills:/app/skills
    restart: unless-stopped
    environment:
      - ARIA_PROCESS_ROLE=web
      - ARIA_WEB_HOST=0.0.0.0
    command: python scripts/web_server.py

  aria-telegram:
    profiles:
      - telegram
    build: .
    container_name: aria-telegram
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
      - ./skills:/app/skills
    restart: unless-stopped
    environment:
      - ARIA_PROCESS_ROLE=telegram
    command: python scripts/telegram_bot.py
