version: '3.8'

services:
  kinthic-api:
    build: .
    container_name: kinthic-api
    ports:
      - "8000:8000"
    volumes:
      - kinthic-data:/home/kinthic/.kinthic
    restart: unless-stopped
    command: python -m uvicorn silex.api.server:app --host 0.0.0.0 --port 8000

  kinthic-dashboard:
    build: 
      context: ./kinthic-dashboard
      dockerfile: Dockerfile
    container_name: kinthic-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - kinthic-api
    restart: unless-stopped
    # Depending on how the dashboard is built, it might run via npm run start
    command: npm run start

  kinthic-telegram:
    profiles:
      - telegram
    build: .
    container_name: kinthic-telegram
    volumes:
      - kinthic-data:/home/kinthic/.kinthic
    restart: unless-stopped
    command: kinthic telegram run

volumes:
  kinthic-data:
