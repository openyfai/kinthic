version: '3.8'

services:
  kronos-api:
    build: .
    container_name: kronos-api
    ports:
      - "8000:8000"
    volumes:
      - kronos-data:/home/kronos/.kronos
    restart: unless-stopped
    command: python -m uvicorn silex.api.server:app --host 0.0.0.0 --port 8000

  kronos-dashboard:
    build: 
      context: ./kronos-dashboard
      dockerfile: Dockerfile
    container_name: kronos-dashboard
    ports:
      - "3000:3000"
    depends_on:
      - kronos-api
    restart: unless-stopped
    # Depending on how the dashboard is built, it might run via npm run start
    command: npm run start

  kronos-telegram:
    profiles:
      - telegram
    build: .
    container_name: kronos-telegram
    volumes:
      - kronos-data:/home/kronos/.kronos
    restart: unless-stopped
    command: kronos telegram run

volumes:
  kronos-data:
