name: Publish PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aria-ui/package-lock.json

      - name: Build web UI
        working-directory: aria-ui
        run: |
          npm ci
          npm run build

      - name: Stage packaged dashboard into aria/web_dist
        run: |
          find aria/web_dist -mindepth 1 -maxdepth 1 ! -name '__init__.py' -exec rm -rf {} +
          cp -r aria-ui/out/. aria/web_dist/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Trusted Publishing: https://pypi.org/manage/project/openyfai-aria/settings/publishing/
        # Link GitHub repo openyfai/aria (environment optional — add repo Environment "pypi" on both
        # sides if you want deployment protection rules).
        # Token fallback: add repo secret PYPI_API_TOKEN, then set:
        # with:
        #   user: __token__
        #   password: ${{ secrets.PYPI_API_TOKEN }}
