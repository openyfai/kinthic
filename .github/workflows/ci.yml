name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install build
      - name: Ruff
        run: ruff check .
      - name: Optional mypy
        continue-on-error: true
        run: mypy silex scripts
      - name: Run tests
        run: python -m pytest tests
      - name: Package build smoke test
        run: python -m build

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kinthic-ink-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: kinthic-ink-ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
      - name: Build UI
        run: npm run build
      - name: Typecheck UI
        run: npm run typecheck
      - name: Test UI reducer
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t kinthic-ci .
