name: Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aria-ui/package-lock.json

      - name: Build Next.js UI
        working-directory: aria-ui
        run: |
          npm ci
          npm run build

      - name: Copy built UI into package
        run: |
          # Clean up existing files except __init__.py
          find aria/web_dist -mindepth 1 -maxdepth 1 ! -name '__init__.py' -exec rm -rf {} +
          # Copy the build output
          cp -r aria-ui/out/. aria/web_dist/
          # Verify the copy worked
          ls -R aria/web_dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Python wheel and sdist
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          # Alternatively use Trusted Publishing (OIDC) by omitting password
          # and ensuring the repo is configured in PyPI.

