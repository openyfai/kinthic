name: Release TUI Binaries

on:
  push:
    tags:
      - 'v*'

jobs:
  build-ui:
    name: Build TUI Binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: node-linux-x64
            outfile: kronos-ui-linux-x64
          - os: macos-13
            target: node-darwin-x64
            outfile: kronos-ui-darwin-x64
          - os: macos-latest
            target: node-darwin-arm64
            outfile: kronos-ui-darwin-arm64

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Project Dependencies
        run: |
          cd kronos-ink-ui
          bun install

      - name: Compile Standalone UI Binary
        run: |
          cd kronos-ink-ui
          bun build --compile --minify --target=${{ matrix.target }} src/index.tsx --outfile dist/${{ matrix.outfile }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.outfile }}
          path: kronos-ink-ui/dist/${{ matrix.outfile }}

  publish-release:
    name: Create GitHub Release
    needs: build-ui
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-binaries/
          merge-multiple: true

      - name: Generate Release Notes & Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-binaries/kronos-ui-linux-x64
            dist-binaries/kronos-ui-darwin-x64
            dist-binaries/kronos-ui-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
