name: Release to PyPI

on:
  push:
    tags:
      - "v*"

# OIDC Trusted Publishing — no PYPI_TOKEN secret needed.
# Configure this repo in PyPI under: Project Settings → Publishing → Trusted Publishers.
permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Node / UI build ────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: aria-ui/package-lock.json

      - name: Build Next.js UI
        working-directory: aria-ui
        # Add NEXT_PUBLIC_* build-time env vars here if needed, e.g.:
        # env:
        #   NEXT_PUBLIC_API_URL: ""
        run: |
          npm ci
          npm run build

      - name: Verify UI build output exists
        run: |
          if [ ! -f aria-ui/out/index.html ]; then
            echo "ERROR: aria-ui/out/index.html not found — Next.js build did not produce a static export."
            echo "Check that next.config.ts has output: 'export' and the build succeeded."
            exit 1
          fi
          echo "UI build verified. Files in aria-ui/out/:"
          find aria-ui/out -type f | head -20

      - name: Copy built UI into package
        run: |
          # Ensure the destination exists (CI starts from a clean checkout,
          # web_dist/ may only contain __init__.py from git, or nothing at all)
          mkdir -p aria/web_dist
          # Remove everything except __init__.py so stale files never persist
          find aria/web_dist -mindepth 1 -maxdepth 1 ! -name '__init__.py' -exec rm -rf {} +
          # Copy the static export
          cp -r aria-ui/out/. aria/web_dist/
          # Hard verification — wheel must have index.html or it's broken
          if [ ! -f aria/web_dist/index.html ]; then
            echo "ERROR: aria/web_dist/index.html missing after copy — aborting."
            exit 1
          fi
          echo "web_dist contents (top level):"
          ls -la aria/web_dist/

      # ── Python build ───────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build Python wheel and sdist
        run: python -m build

      - name: Verify wheel contains UI assets
        run: |
          # Unzip the wheel and check that _next/static exists inside
          WHEEL=$(ls dist/*.whl | head -1)
          echo "Inspecting wheel: $WHEEL"
          python -m zipfile -l "$WHEEL" | grep "web_dist/index.html" || {
            echo "ERROR: web_dist/index.html not found inside the wheel. Distribution is broken."
            exit 1
          }
          echo "Wheel verification passed."

      - name: Publish to PyPI (Trusted Publisher / OIDC)
        uses: pypa/gh-action-pypi-publish@release/v1
