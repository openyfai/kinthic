<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <!-- Transparent background -->
  
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Node Graph Icon -->
  <g transform="translate(140, 100)">
    <!-- Edges -->
    <line x1="-30" y1="0" x2="0" y2="-20" stroke="#4338ca" stroke-width="3" opacity="0.6"/>
    <line x1="-30" y1="0" x2="0" y2="20" stroke="#4338ca" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="-20" x2="30" y2="0" stroke="#4338ca" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="20" x2="30" y2="0" stroke="#4338ca" stroke-width="3" opacity="0.6"/>
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#4338ca" stroke-width="3" opacity="0.4"/>
    
    <!-- Nodes -->
    <circle cx="-30" cy="0" r="6" fill="#312e81" />
    <circle cx="0" cy="-20" r="8" fill="#312e81" />
    <circle cx="0" cy="20" r="8" fill="#312e81" />
    <circle cx="30" cy="0" r="10" fill="#312e81" filter="url(#glow)"/>
  </g>

  <!-- Wordmark -->
  <text x="210" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="url(#textGrad)" letter-spacing="-3">
    kinthic
  </text>
  
  <!-- Subtle tagline/version under it (optional, but requested "in top of it put kinthic") -->
  <!-- We leave it minimalist to match OpenClaw/Hermes -->
</svg>
