<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARIA | World Model Visualizer</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Force Graph Library -->
    <script src="https://unpkg.com/force-graph"></script>
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --panel-bg: rgba(31, 40, 51, 0.7);
            --text-main: #c5c6c7;
            --text-accent: #66fcf1;
            --border-color: rgba(102, 252, 241, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        #graph-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Glassmorphism Panel */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 320px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .subtitle {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            padding-bottom: 8px;
        }

        .stat-value {
            font-family: 'JetBrains Mono', monospace;
            color: #ffffff;
        }

        .node-tooltip {
            background: rgba(11, 12, 16, 0.9) !important;
            border: 1px solid var(--text-accent) !important;
            border-radius: 8px !important;
            padding: 12px !important;
            font-family: 'Inter', sans-serif !important;
            box-shadow: 0 4px 15px rgba(102, 252, 241, 0.2) !important;
            pointer-events: none;
        }

        /* Legend */
        .legend {
            margin-top: 24px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 12px;
        }

        .btn-refresh {
            margin-top: 24px;
            width: 100%;
            background: transparent;
            border: 1px solid var(--text-accent);
            color: var(--text-accent);
            padding: 10px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            background: var(--text-accent);
            color: var(--bg-color);
        }
    </style>
</head>
<body>

    <div id="hud">
        <h1>ARIA</h1>
        <div class="subtitle">World Model</div>
        
        <div class="stat-row">
            <span>Total Nodes</span>
            <span class="stat-value" id="node-count">0</span>
        </div>
        <div class="stat-row">
            <span>Total Causal Links</span>
            <span class="stat-value" id="edge-count">0</span>
        </div>

        <div class="legend" id="legend-container">
            <!-- Populated dynamically -->
        </div>

        <button class="btn-refresh" onclick="fetchData()">FORCE SYNC</button>
    </div>

    <div id="graph-container"></div>

    <script>
        // Color palette inspired by Obsidian / Cyberpunk
        const colorPalette = {
            'fact': '#ff2a6d',
            'concept': '#05d9e8',
            'entity': '#01ffc3',
            'hypothesis': '#ffd700',
            'goal': '#b026ff',
            'default': '#ffffff'
        };

        const Graph = ForceGraph()(document.getElementById('graph-container'))
            .backgroundColor('#0b0c10')
            .nodeRelSize(6)
            .nodeVal(node => node.val)
            .nodeColor(node => colorPalette[node.group] || colorPalette['default'])
            .nodeLabel(node => {
                return `
                    <div class="node-tooltip">
                        <div style="font-family: 'JetBrains Mono'; color: ${colorPalette[node.group] || colorPalette['default']}; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 4px;">[${node.group}]</div>
                        <div style="color: white; font-weight: 600; max-width: 250px; white-space: pre-wrap;">${node.label}</div>
                        <div style="color: #888; font-size: 0.8rem; margin-top: 6px;">Confidence: ${(node.val / 10).toFixed(2)}</div>
                    </div>
                `;
            })
            .linkColor(() => 'rgba(102, 252, 241, 0.15)')
            .linkWidth(link => Math.max(0.5, link.strength * 2))
            .linkDirectionalParticles(2)
            .linkDirectionalParticleWidth(1.5)
            .linkDirectionalArrowLength(3.5)
            .linkDirectionalArrowRelPos(1)
            .onNodeHover(node => {
                // Highlight connected links when hovering over a node
                document.getElementById('graph-container').style.cursor = node ? 'pointer' : null;
            })
            .d3Force('charge').strength(-200);

        // Fetch data from FastAPI backend
        async function fetchData() {
            try {
                const response = await fetch('/api/graph');
                const data = await response.json();
                
                Graph.graphData(data);
                
                // Update HUD
                document.getElementById('node-count').innerText = data.nodes.length;
                document.getElementById('edge-count').innerText = data.links.length;

                // Build Legend
                const groups = [...new Set(data.nodes.map(n => n.group))];
                const legendHtml = groups.map(g => `
                    <div class="legend-item">
                        <div class="dot" style="background-color: ${colorPalette[g] || colorPalette['default']}"></div>
                        <span>${g.toUpperCase()}</span>
                    </div>
                `).join('');
                document.getElementById('legend-container').innerHTML = legendHtml;

            } catch (error) {
                console.error("Failed to fetch graph data:", error);
            }
        }

        // Initial fetch
        fetchData();
        
        // Auto-refresh every 10 seconds to see ARIA learning in real-time
        setInterval(fetchData, 10000);

    </script>
</body>
</html>
