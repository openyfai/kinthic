[project]
name = "kinthic"
version = "1.0.0"
description = "kinthic — local-first AI operator powered by the Silex memory engine."
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    { name = "Youssef El Fajlaoui" },
]
maintainers = [
    { name = "Youssef El Fajlaoui" },
]
keywords = ["ai-agent", "local-first", "knowledge-graph", "llm", "autonomy", "telegram", "tools", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.0",
    "networkx>=3.0",
    "ddgs>=9.0.0",
    "python-telegram-bot>=21.0",
    "openai>=1.79.0",
    "anthropic>=0.52.0",
    "docker>=7.0",
    "httpx>=0.27",
    "watchdog>=4.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
]
browser = [
    "playwright>=1.45",
    "playwright-stealth>=1.0",
    "html2text>=2024.2.26",
]
vector = [
    "chromadb>=0.5",
]
local = [
    "httpx>=0.27",
]
voice = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24.0",
    "pyttsx3>=2.90",
]
discord = [
    "discord.py>=2.3",
]



[project.scripts]
kinthic = "scripts.cli:main"
kinthic-telegram = "scripts.telegram_bot:main"
kinthic-discord = "scripts.discord_bot:main"

[project.urls]
Homepage = "https://github.com/openyfai/kinthic"
Repository = "https://github.com/openyfai/kinthic"
Issues = "https://github.com/openyfai/kinthic/issues"
Changelog = "https://github.com/openyfai/kinthic/blob/main/CHANGELOG.md"
Documentation = "https://github.com/openyfai/kinthic#readme"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
py-modules = []

[tool.setuptools.package-data]

[tool.setuptools.packages.find]
include = ["silex*", "scripts*", "plugins*"]
exclude = ["kinthic-ui*", "tests*", "scratch*", "workspace*"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E402",  # Allow module-level imports not at top of file (used for lazy-loading provider/optional modules)
    "E741",  # Allow ambiguous variable name (e.g. 'l' in list comprehensions in test scripts)
    "E501",  # Allow long lines (prevents warnings on test JSON payloads and inline SQL queries)
    "F401",  # Ignore unused imports (pre-existing in optional voice/audio modules and tests)
    "F841",  # Ignore unused local variables (pre-existing in tests and mocks)
    "F821",  # Ignore undefined name (pre-existing type annotations for unimported modules)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
