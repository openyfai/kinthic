[project]
name = "aria-agi"
version = "1.0.0"
description = "ARIA — Adaptive Reasoning & Intelligence Architecture. A cognitive AI agent with causal world model, self-improvement, and multi-agent debate."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.0",
    "networkx>=3.0",
    "ddgs>=9.0.0",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
]
web = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.scripts]
aria = "scripts.run:main"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"
