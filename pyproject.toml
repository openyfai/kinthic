[project]
name = "openyfai-vyn"
version = "1.2.1"
description = "VYN — local-first AI operator powered by the ARIA memory engine (OpenYF AI)."
readme = "README.md"
license = {text = "AGPL-3.0-or-later"}
requires-python = ">=3.11"
authors = [
    { name = "Youel" },
]
maintainers = [
    { name = "OpenYF AI" },
]
keywords = ["ai-agent", "local-first", "knowledge-graph", "llm", "autonomy", "telegram", "tools", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.0",
    "networkx>=3.0",
    "ddgs>=9.0.0",
    "python-telegram-bot>=21.0",
    "openai>=1.79.0",
    "anthropic>=0.52.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "playwright>=1.45",
    "playwright-stealth>=1.0",
    "html2text>=2024.2.26",
    "chromadb>=0.5",
    "docker>=7.0",
    "httpx>=0.27",
    "watchdog>=4.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
]
browser = [
    "playwright>=1.45",
    "playwright-stealth>=1.0",
    "html2text>=2024.2.26",
]
vector = [
    "chromadb>=0.5",
]
local = [
    "httpx>=0.27",
]


[project.scripts]
vyn = "scripts.cli:main"
vyn-web = "scripts.cli:run_web"
vyn-telegram = "scripts.telegram_bot:main"

[project.urls]
Homepage = "https://github.com/openyfai/vyn"
Repository = "https://github.com/openyfai/vyn"
Issues = "https://github.com/openyfai/vyn/issues"
Changelog = "https://github.com/openyfai/vyn/blob/main/CHANGELOG.md"
Documentation = "https://github.com/openyfai/vyn#readme"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
py-modules = []

[tool.setuptools.package-data]
# web_dist is populated by CI before the wheel is built (see .github/workflows/release.yml).
# Patterns are explicit at every depth because setuptools **/* has known
# recursion gaps on some versions when directory structures are deep.
aria = [
    "web_dist/*",
    "web_dist/**/*",
    "web_dist/**/**/*",
    "web_dist/**/**/**/*",
    "web_dist/**/**/**/**/*",
]

[tool.setuptools.packages.find]
include = ["aria*", "scripts*"]
exclude = ["aria-ui*", "tests*", "scratch*", "workspace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
