[project]
name = "openyfai-aria"
version = "1.0.1"
description = "Local-first AI agent with memory, knowledge graph, tools, web dashboard, and Telegram (OpenYF AI)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "Youel" },
]
maintainers = [
    { name = "OpenYF AI" },
]
keywords = ["ai-agent", "local-first", "knowledge-graph", "llm", "autonomy", "telegram", "tools", "memory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "aiosqlite>=0.20.0",
    "aiofiles>=24.0",
    "networkx>=3.0",
    "ddgs>=9.0.0",
    "python-telegram-bot>=21.0",
    "openai>=1.79.0",
    "anthropic>=0.52.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
    "mypy>=1.10",
]
web = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
browser = [
    "playwright>=1.45",
    "playwright-stealth>=1.0",
    "html2text>=2024.2.26",
]
vector = [
    "chromadb>=0.5",
]
local = [
    "httpx>=0.27",
]
providers = [
    "openai>=1.79.0",
    "anthropic>=0.52.0",
]
full = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "playwright>=1.45",
    "playwright-stealth>=1.0",
    "html2text>=2024.2.26",
    "chromadb>=0.5",
    "docker>=7.0",
    "httpx>=0.27",
    "openai>=1.79.0",
    "anthropic>=0.52.0",
]

[project.scripts]
aria = "scripts.cli:main"
aria-web = "scripts.cli:run_web"
aria-telegram = "scripts.telegram_bot:main"

[project.urls]
Homepage = "https://github.com/openyfai/aria"
Repository = "https://github.com/openyfai/aria"
Issues = "https://github.com/openyfai/aria/issues"
Changelog = "https://github.com/openyfai/aria/blob/main/CHANGELOG.md"
Documentation = "https://github.com/openyfai/aria#readme"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
py-modules = []

[tool.setuptools.package-data]
aria = ["web_dist/**/*"]

[tool.setuptools.packages.find]
include = ["aria*", "scripts*"]
exclude = ["aria-ui*", "tests*", "scratch*", "workspace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
